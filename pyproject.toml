[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-heartbeat"
version = "0.1.0"
description = "配信者向け心拍・心音同期の心臓描画 StreamHeartbeat(ぬ)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PySide6>=6.7.0,<6.10; sys_platform == 'darwin'",
  "PySide6>=6.7.0; sys_platform != 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-qt>=4.4.0",
  "ruff>=0.6.0",
  "pyinstaller>=6.10.0",
]

[project.scripts]
stream-heartbeat = "stream_heartbeat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream_heartbeat = ["assets/*", "assets/heart_samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
