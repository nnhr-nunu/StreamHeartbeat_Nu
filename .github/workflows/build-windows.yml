name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: pytest -q --tb=short
      - name: Lint
        run: ruff check src tests
      - name: Build exe
        if: github.event_name != 'pull_request'
        run: pyinstaller --noconfirm --clean packaging/StreamHeartbeat-windows.spec
      # 使う Qt の部品が入っていて、使わない大きな Qt（GPL だけの部品・WebEngine など）が入っていないか
      - name: Check Qt files
        if: github.event_name != 'pull_request'
        run: |
          $qt = "dist/StreamHeartbeat/_internal/PySide6"
          $need = "plugins/platforms/qwindows.dll", "plugins/styles/qmodernwindowsstyle.dll",
            "plugins/imageformats/qsvg.dll", "plugins/multimedia/ffmpegmediaplugin.dll",
            "opengl32sw.dll", "Qt6OpenGLWidgets.dll", "Qt6Multimedia.dll", "Qt6WebSockets.dll"
          foreach ($f in $need) { if (-not (Test-Path "$qt/$f")) { throw "Qt の部品が足りない: $f" } }
          $extra = Get-ChildItem -Recurse "dist/StreamHeartbeat" -Include "Qt6VirtualKeyboard*", "Qt6Quick*",
            "Qt6Qml*", "Qt6WebEngine*", "Qt6Graphs*", "Qt6Charts*", "Qt6Pdf*", "Qt63D*"
          if ($extra) { throw "使わない Qt が入っている: $($extra.Name -join ', ')" }
          "{0:N0} MB" -f ((Get-ChildItem -Recurse dist/StreamHeartbeat | Measure-Object Length -Sum).Sum / 1MB)
      - if: github.event_name != 'pull_request'
        run: |
          Copy-Item packaging/HOW_TO_RUN.txt dist/StreamHeartbeat/使いかた.txt
          python packaging/write_licenses.py dist/StreamHeartbeat
      - if: github.event_name != 'pull_request'
        run: Compress-Archive -Path dist/StreamHeartbeat/* -DestinationPath windows-StreamHeartbeat.zip -Force
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows-StreamHeartbeat.zip

  # Mac は Apple チップ版と Intel 版を別々に作る。どちらも macOS 12 以降で開ける形にする
  # （2016 年の MacBook Pro など、macOS 12 までしか入らない Mac があるため）
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-zip
            zip: macOS-StreamHeartbeat.zip
            python_from: actions
          - os: macos-15-intel
            artifact: macos-intel-zip
            zip: macOS-intel-StreamHeartbeat.zip
            python_from: python.org
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python_from == 'actions'
        with:
          python-version: "3.10"
      # Intel の Mac 用は、macOS 11 から動く python.org の Python で作る
      - name: Install python.org 3.10 for macOS 12
        if: matrix.python_from == 'python.org'
        run: |
          curl -fsSL -o /tmp/python-3.10.11-macos11.pkg \
            https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg
          sudo installer -pkg /tmp/python-3.10.11-macos11.pkg -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.10/bin"
          if [ ! -e "$PYBIN/python" ]; then
            ln -sf python3 "$PYBIN/python"
          fi
          echo "$PYBIN" >> "$GITHUB_PATH"
      - name: Show CPU and Python
        run: |
          uname -m
          python --version
          python -c "import sys; print(sys.executable)"
      - run: python -m pip install -U pip
      - run: python scripts/ci_macos_install.py
      - name: Show Qt version
        run: python -c "import PySide6; print('PySide6', PySide6.__version__)"
      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: python -m pytest -q --tb=short
      # offscreen では OpenGL が使えないので、描画のテストだけ Mac の本物の画面で回す。
      # GPU が無い Mac では skip になるので、結果の行を注釈に出してログインなしでも見えるようにする
      - name: Test OpenGL
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs --tb=short tests/test_gl_platform.py tests/test_heart_render.py tests/test_echo.py | tee gl-test.log
          summary=$(grep -E "SKIPPED|passed|failed" gl-test.log | tail -n 6 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=OpenGL のテスト (${{ matrix.artifact }})::${summary}"
      - name: Build app
        if: github.event_name != 'pull_request'
        run: pyinstaller --noconfirm --clean packaging/StreamHeartbeat-macos.spec
      - name: Check app
        if: github.event_name != 'pull_request'
        run: |
          app=dist/StreamHeartbeat.app
          file "$app/Contents/MacOS/StreamHeartbeat"
          lipo -info "$app/Contents/MacOS/StreamHeartbeat"
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$app/Contents/Info.plist"
          plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Confirm macOS 12 binaries
        if: github.event_name != 'pull_request'
        run: python scripts/ci_macos_minos.py
      # 作ったアプリを実際に開き、15 秒たっても落ちていないか・Python のエラーが出ていないかを見る
      - name: Launch app
        if: github.event_name != 'pull_request'
        run: |
          dist/StreamHeartbeat.app/Contents/MacOS/StreamHeartbeat > launch.log 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0
            wait "$pid" || code=$?
            cat launch.log
            echo "::error::アプリが起動してすぐ終了した（終了コード ${code}）"
            exit 1
          fi
          kill "$pid"
          cat launch.log
          head=$(head -n 8 launch.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=起動の確認 (${{ matrix.artifact }})::15 秒動いた。ログ $(wc -l < launch.log | tr -d ' ') 行%0A${head}"
          if grep -q "Traceback" launch.log; then
            echo "::error::起動中に Python のエラーが出た"
            exit 1
          fi
      # zip -r だとアプリの中のリンクが実体に置き換わり「壊れている」と出ることがあるので ditto で固める
      - name: Zip
        if: github.event_name != 'pull_request'
        run: |
          mkdir pkg
          ditto dist/StreamHeartbeat.app pkg/StreamHeartbeat.app
          cp packaging/HOW_TO_RUN.txt pkg/使いかた.txt
          python packaging/write_licenses.py pkg
          ditto -c -k --sequesterRsrc pkg "${{ matrix.zip }}"
          ls -l "${{ matrix.zip }}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip }}

  release:
    needs: [windows, macos]
    if: github.event_name != 'pull_request' && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' src/stream_heartbeat/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
      # アプリは題名の「v0.2.0」のような版を読んで、新しい版が出たかを知る（update_check.py）。題名を変えるときも版は残す
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版 v${{ steps.version.outputs.version }} / Latest (unzip and run)
          body: |
            🇬🇧 **English instructions are at the bottom of this page.** The app starts in English automatically if your OS language is not Japanese.

            ## ダウンロード手順

            1. このページ下部の **Assets** を開く
            2. 下の表から、使っている PC に合う zip をダウンロードする
            3. ダウンロードした zip を展開する
            4. Windows は `StreamHeartbeat.exe`、Mac は `StreamHeartbeat.app` を開く

            | PC | ダウンロードするファイル |
            | -- | ------------ |
            | Windows 10 / 11 | `windows-StreamHeartbeat.zip` |
            | Mac（M1 / M2 / M3 など Apple チップ） | `macOS-StreamHeartbeat.zip` |
            | Mac（Intel。2016 年の MacBook Pro など） | `macOS-intel-StreamHeartbeat.zip` |

            Mac は macOS 12 以降で動きます。どれか分からないときは、左上のリンゴマーク → **この Mac について** を見てください。「チップ」が Apple なら `macOS-StreamHeartbeat.zip`、「プロセッサ」が Intel なら `macOS-intel-StreamHeartbeat.zip` です。

            ## OBS への取り込み

            OBS で `StreamHeartbeat(ぬ) - 配信出力` の窓を取り込み、クロマキーで緑を抜いてください。

            - Windows: ソース「ウィンドウキャプチャ」
            - Mac: ソース「macOS 画面キャプチャ」→ 方法「ウィンドウキャプチャ」

            ## 起動時の警告（署名していないため出ます）

            ウイルスではありません。ストア経由の配布ではないので、OS が初回だけ止めます。

            **Windows** 「Windows によって PC が保護されました」と出たら、**詳細情報** → **実行** を選んでください。

            **Mac** 「開けません」「開発元を確認できません」などと出たら:

            1. いったん **完了**（または **キャンセル**）で閉じる
            2. **システム設定 → プライバシーとセキュリティ**（macOS 12 は **システム環境設定 → セキュリティとプライバシー → 一般**）を開き、「StreamHeartbeat」の横の **このまま開く** を押す
            3. もう一度 `StreamHeartbeat.app` を開き、確認が出たら **開く** を押す

            「このアプリケーションはこの Mac ではサポートされていません」と出たら zip を間違えています。Intel の Mac は `macOS-intel-StreamHeartbeat.zip` を使ってください。

            ## マイクの許可（Mac）

            初回にマイクの使用を聞かれたら **許可** を押してください。断ってしまったときは **システム設定 → プライバシーとセキュリティ → マイク**（macOS 12 は **システム環境設定 → セキュリティとプライバシー → プライバシー → マイク**）で StreamHeartbeat をオンにして、アプリを開き直してください。新しい版に入れ替えたあとは、もう一度聞かれることがあります。

            ## 設定の引き継ぎ

            プロファイルや補正は zip の中ではなく PC 側（Windows は `%LOCALAPPDATA%\StreamHeartbeat_Nu`、Mac は `~/Library/Application Support/StreamHeartbeat_Nu`）に保存するので、新しい版の zip に入れ替えても消えません。

            詳しい使い方はリポジトリの README を見てください。

            ---

            ## English

            **StreamHeartbeat(ぬ)** shows a heart that beats in time with your own heartbeat (picked up by a microphone) so you can put it in your OBS scene. The app starts in English automatically unless your OS display language is Japanese, and you can switch between Japanese and English at any time with the "English" / "日本語" button at the bottom of the control window.

            ### How to download

            1. Scroll down to **Assets** on this page.
            2. Download the zip that matches your PC (see the table below).
            3. Unzip it.
            4. Open `StreamHeartbeat.exe` (Windows) or `StreamHeartbeat.app` (macOS).

            | PC | File to download |
            | -- | ---------------- |
            | Windows 10 / 11 | `windows-StreamHeartbeat.zip` |
            | Mac with Apple silicon (M1 / M2 / M3 …) | `macOS-StreamHeartbeat.zip` |
            | Mac with an Intel chip (e.g. a 2016 MacBook Pro) | `macOS-intel-StreamHeartbeat.zip` |

            macOS 12 or later is required. If you are not sure which Mac you have, click the Apple menu → **About This Mac**. If "Chip" says Apple, use `macOS-StreamHeartbeat.zip`; if "Processor" says Intel, use `macOS-intel-StreamHeartbeat.zip`.

            ### Adding it to OBS

            In OBS, capture the window titled `StreamHeartbeat(ぬ) - 配信出力` and remove the green background with a Chroma Key filter.

            - Windows: *Window Capture* source
            - macOS: *macOS Screen Capture* source → Method: *Window Capture*

            ### Security warnings on first launch (the app is not code-signed)

            It is not a virus. The app is not distributed through a store, so the OS stops it once.

            **Windows:** if you see "Windows protected your PC", click **More info** → **Run anyway**.

            **macOS:** if you see "cannot be opened" or "cannot verify the developer":

            1. Close the dialog (**Done** or **Cancel**).
            2. Open **System Settings → Privacy & Security** (macOS 12: **System Preferences → Security & Privacy → General**) and click **Open Anyway** next to "StreamHeartbeat".
            3. Open `StreamHeartbeat.app` again and click **Open** when asked.

            If you see "This application is not supported on this Mac", you downloaded the wrong zip. Intel Macs need `macOS-intel-StreamHeartbeat.zip`.

            ### Microphone permission (macOS)

            When asked for microphone access, click **Allow**. If you declined by mistake, turn StreamHeartbeat on in **System Settings → Privacy & Security → Microphone** and relaunch the app. You may be asked again after updating to a newer version.

            ### Keeping your settings

            Profiles and calibration are stored on your PC, not inside the zip (Windows: `%LOCALAPPDATA%\StreamHeartbeat_Nu`, macOS: `~/Library/Application Support/StreamHeartbeat_Nu`), so replacing the zip with a newer version does not erase them.

            A detailed guide (in Japanese) and an English summary are in the [README](https://github.com/nnhr-nunu/StreamHeartbeat_Nu#english-summary).
          files: |
            windows-zip/windows-StreamHeartbeat.zip
            macos-zip/macOS-StreamHeartbeat.zip
            macos-intel-zip/macOS-intel-StreamHeartbeat.zip
          fail_on_unmatched_files: true
          make_latest: true
      # 版ごとの目印のタグ（v0.2.0 など）。その版で最初に出したコミットに付け、あとは動かさない
      # タグが付けられなくてもリリースは出ているので、CI の失敗扱いにしない
      - name: Tag the version
        continue-on-error: true
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  # CI が失敗したら Issue を 1 件だけ立てて知らせる（開いている間は増やさない）。直ったら自動で閉じる。
  # 失敗が続いてもリリースが古いまま気づかれない、を防ぐ
  notify:
    needs: [windows, macos, release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: "CI が失敗していて、リリースが最新になっていません"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open an issue when CI fails
        if: contains(needs.*.result, 'failure')
        run: |
          num=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty")
          if [ -n "$num" ]; then
            echo "Issue #$num は開いているので、増やさない"
            exit 0
          fi
          gh issue create --title "$ISSUE_TITLE" --body "main への push で CI が失敗しました。直るまで、リリース（latest）は古いままです。

          - 失敗した実行: ${RUN_URL}
          - 直って CI が全部通ると、この Issue は自動で閉じます。"
      - name: Close the issue when CI passes
        if: needs.windows.result == 'success' && needs.macos.result == 'success' && needs.release.result == 'success'
        run: |
          for num in $(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number'); do
            gh issue close "$num" --comment "CI が通り、リリースを更新しました: ${RUN_URL}"
          done
